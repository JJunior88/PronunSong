name: PronunSong — testes e site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Testar e preparar site
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Executar testes e verificar JavaScript
        run: |
          npm test
          npm run check
      - name: Preparar arquivos públicos
        run: |
          mkdir -p dist/src
          cp index.html dist/
          cp src/app.js src/data.js src/import.js src/styles.css src/icon.svg dist/src/
          touch dist/.nojekyll
      - name: Disponibilizar site para download
        uses: actions/upload-artifact@v4
        with:
          name: PronunSong-web
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Preparar artefato do GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publicar no GitHub Pages
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Verificar configuração do Pages
        uses: actions/configure-pages@v5
      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
