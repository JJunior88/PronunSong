plugins { id 'com.android.application' }
android {
    namespace 'br.com.pronunsong'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig { applicationId 'br.com.pronunsong'; minSdk 26; targetSdk 35; versionCode 6; versionName '0.5.1' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
// Bundle the web app directly; no hosted site is required to open a lesson.
def webAssets = layout.buildDirectory.dir('generated/webAssets')
tasks.register('bundleWebAssets', Copy) {
    from('../..') { include 'index.html'; include 'src/**' }
    into(webAssets)
}
android.sourceSets.main.assets.srcDir(webAssets)
tasks.named('preBuild').configure { dependsOn('bundleWebAssets') }
